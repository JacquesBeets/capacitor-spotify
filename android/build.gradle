ext {
    junitVersion = project.hasProperty('junitVersion') ? rootProject.ext.junitVersion : '4.13.2'
    androidxAppCompatVersion = project.hasProperty('androidxAppCompatVersion') ? rootProject.ext.androidxAppCompatVersion : '1.7.1'
    androidxJunitVersion = project.hasProperty('androidxJunitVersion') ? rootProject.ext.androidxJunitVersion : '1.3.0'
    androidxEspressoCoreVersion = project.hasProperty('androidxEspressoCoreVersion') ? rootProject.ext.androidxEspressoCoreVersion : '3.7.0'
    // 1.17.0 requires compileSdk 36 / AGP 8.9.1 — too new for Capacitor 7
    // apps (compileSdk 35). Fallback only; apps can override via variables.gradle.
    androidxCoreKTXVersion = project.hasProperty('androidxCoreKTXVersion') ? rootProject.ext.androidxCoreKTXVersion : '1.16.0'
}

buildscript {
    ext.kotlin_version = project.hasProperty("kotlin_version") ? rootProject.ext.kotlin_version : '2.2.20'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // Lowest AGP shared by Capacitor 7 and 8 apps. Gradle merges plugin
        // buildscript classpaths and the highest declared version wins, so a
        // Cap 8 app's newer AGP still takes precedence — but declaring 8.13
        // here would force Cap 7 apps onto a Gradle they don't ship with.
        classpath 'com.android.tools.build:gradle:8.7.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace = "com.jacquesbeets.plugins.spotify"
    compileSdk = project.hasProperty('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 36
    defaultConfig {
        minSdkVersion project.hasProperty('minSdkVersion') ? rootProject.ext.minSdkVersion : 24
        targetSdkVersion project.hasProperty('targetSdkVersion') ? rootProject.ext.targetSdkVersion : 36
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    lintOptions {
        abortOnError = false
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

kotlin {
    jvmToolchain(21)
}

// Spotify does not publish the App Remote SDK to any public Maven repository, so
// the official AAR is vendored under android/repo as a local Maven repository.
def spotifyLocalRepo = uri("${projectDir}/repo")

repositories {
    google()
    mavenCentral()
    maven { url spotifyLocalRepo }
}

// Gradle repositories are NOT transitive: the consuming app resolves this
// plugin's dependencies using its own repository list. Registering the vendored
// repo on every project of the consuming build makes `npx cap sync` enough —
// no app-side Gradle changes are required to resolve the App Remote AAR.
rootProject.allprojects {
    repositories {
        maven { url spotifyLocalRepo }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation project(':capacitor-android')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.core:core-ktx:$androidxCoreKTXVersion"
    // `api` so the consuming app can also talk to the App Remote types directly.
    api "com.spotify.appremote:app-remote:0.8.0"
    implementation "com.spotify.android:auth:5.0.0"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
}
